<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e4f0"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bgGrad)"/>
  <!-- 账本/书本图标 -->
  <g transform="translate(64, 60)">
    <!-- 书本主体 -->
    <rect x="0" y="0" width="128" height="136" rx="8" fill="url(#bookGrad)" opacity="0.95"/>
    <!-- 书脊 -->
    <rect x="0" y="0" width="16" height="136" rx="8" fill="#5a67c9"/>
    <rect x="8" y="0" width="8" height="136" fill="#4a57b9"/>
    <!-- 页面线条 -->
    <rect x="28" y="28" width="84" height="6" rx="3" fill="#c8c4d8"/>
    <rect x="28" y="44" width="72" height="6" rx="3" fill="#c8c4d8"/>
    <rect x="28" y="60" width="80" height="6" rx="3" fill="#c8c4d8"/>
    <!-- 金额标签 -->
    <rect x="28" y="84" width="56" height="32" rx="6" fill="#667eea"/>
    <text x="56" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">¥</text>
    <!-- 硬币装饰 -->
    <circle cx="108" cy="100" r="16" fill="#ff9500" opacity="0.9"/>
    <circle cx="108" cy="100" r="11" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
